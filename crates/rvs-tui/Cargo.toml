[package]
name = "rvs-tui"
default-run = "rvs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rvs"
path = "src/main.rs"

[[bin]]
name = "rvspp"
path = "src/bin/rvspp.rs"

[dependencies]
rvs-app = { path = "../rvs-app" }
rvs-machine = { path = "../rvs-machine" }
rvs-machine-riscv = { path = "../rvs-machine-riscv" }
rvs-app-keys = { path = "../rvs-app-keys" }
rvs-ui = { path = "../rvs-ui" }
rvs-app-cmds = { path = "../rvs-app-cmds" }
clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
rvs-explorer = { path = "../rvs-explorer" }
rvs-machine = { path = "../rvs-machine" }
rvs-machine-riscv = { path = "../rvs-machine-riscv" }
rvs-theme = { path = "../rvs-theme" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { workspace = true }
