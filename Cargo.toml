[workspace]
resolver = "2"
members = [
  "crates/rvs-tcl",
  "crates/rvs-regs",
  "crates/rvs-memory",
  "crates/rvs-transpile",
  "crates/rvs-sim",
  "crates/rvs-asm-syntax",
  "crates/rvs-assembler",
  "crates/rvs-fpu",
  "crates/rvs-ecall",
  "crates/rvs-executor",
  "crates/rvs-format",
  "crates/rvs-editor",
  "crates/rvs-explorer",
  "crates/rvs-syntax",
  "crates/rvs-app",
  "crates/rvs-app-keys",
  "crates/rvs-app-cmds",
  "crates/rvs-ui-panes",
  "crates/rvs-ui-modal",
  "crates/rvs-ui",
  "crates/rvs-tui"
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["RVS++ Contributors"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
dirs = "6"
insta = "1"
proptest = "1"
