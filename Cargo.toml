[workspace]
resolver = "2"
members = [
  "crates/rvs-tcl",
  "crates/rvs-regs",
  "crates/rvs-memory",
  "crates/rvs-transpile",
  "crates/rvs-sim",
  "crates/rvs-asm-syntax",
  "crates/rvs-assembler",
  "crates/rvs-fpu",
  "crates/rvs-ecall",
  "crates/rvs-executor",
  "crates/rvs-format",
  "crates/rvs-editor",
  "crates/rvs-explorer",
  "crates/rvs-syntax",
  "crates/rvs-theme",
  "crates/rvs-machine",
  "crates/rvs-machine-riscv",
  "crates/rvs-app",
  "crates/rvs-app-keys",
  "crates/rvs-app-cmds",
  "crates/rvs-ui-panes",
  "crates/rvs-ui-modal",
  "crates/rvs-ui",
  "crates/rvs-tui",
  "crates/repository-guards",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["RVS++ Contributors"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
dirs = "7"
shell-words = "1.1"
signal-hook = "0.3"
tempfile = "3"
insta = "1"
proptest = "1"

[workspace.lints.clippy]
cognitive_complexity = "warn"
enum_glob_use = "warn"
fn_params_excessive_bools = "warn"
needless_for_each = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
ref_option = "warn"
string_add = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"
disallowed_methods = "warn"
disallowed_macros = "warn"
