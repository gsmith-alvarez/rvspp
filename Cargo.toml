[workspace]
resolver = "2"
members = [
  "crates/rvs-core",
  "crates/rvs-tui",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["RVS++ Contributors"]

[workspace.dependencies]
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
